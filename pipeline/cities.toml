# One entry per city. box = city limits [west, south, east, north] (matches lib/cities.ts in the app).
# default_mph = limit on unsigned local streets (used when OSM has no maxspeed).
# arterial_mph = limit on unsigned collectors/arterials where the city sets one (else 25-40 by class).
# Defaults marked "verify" need a check against the city's current ordinance before launch.
# pbf = Geofabrik extract that covers the city.

[city.dc]
name = "Washington, DC"
box = [-77.12, 38.79, -76.909, 38.996]
default_mph = 20
arterial_mph = 25   # DC: 20 mph local default, 25 mph arterials unless posted
pbf = "https://download.geofabrik.de/north-america/us/district-of-columbia-latest.osm.pbf"

[city.seattle]
name = "Seattle"
box = [-122.46, 47.48, -122.22, 47.74]
default_mph = 20
arterial_mph = 25   # SDOT 2019: 20 mph non-arterial, 25 mph arterial unless posted
pbf = "https://download.geofabrik.de/north-america/us/washington-latest.osm.pbf"

[city.portland]
name = "Portland"
box = [-122.84, 45.43, -122.47, 45.66]
default_mph = 20   # PBOT 2018: 20 mph residential; arterials are posted
pbf = "https://download.geofabrik.de/north-america/us/oregon-latest.osm.pbf"

[city.san-francisco]
name = "San Francisco"
box = [-122.52, 37.70, -122.35, 37.84]
default_mph = 25   # California Vehicle Code business/residence default
pbf = "https://download.geofabrik.de/north-america/us/california/norcal-latest.osm.pbf"

[city.los-angeles]
name = "Los Angeles"
box = [-118.67, 33.70, -118.15, 34.34]
default_mph = 25   # California Vehicle Code business/residence default
pbf = "https://download.geofabrik.de/north-america/us/california/socal-latest.osm.pbf"

[city.chicago]
name = "Chicago"
box = [-87.94, 41.64, -87.52, 42.03]
default_mph = 30   # Chicago municipal code citywide default unless posted
pbf = "https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf"
# Cook County LTS 2023 (UMN Accessibility Observatory method on OSM; fields way_id, lts "1".."4", name).
# Layer 13 is the 2022 edition (fields way_id, ltsrank). Fetch with
# uv run python scripts/fetch_arcgis.py https://gis.cookcountyil.gov/traditional/rest/services/DOTH_expanded/MapServer/14 sources/chicago/cook_lts_2023.geojson --box -87.94 41.64 -87.52 42.03 --fields name,lts,way_id
# The second entry matches the same layer by geometry for OSM ways split or redrawn since 2023.
overrides = [
  { name = "Cook County LTS 2023", path = "sources/chicago/cook_lts_2023.geojson", way_id = "way_id", lts = "lts" },
  { name = "Cook County LTS 2023 (spatial)", path = "sources/chicago/cook_lts_2023.geojson", lts = "lts", join = "spatial" },
]

[city.austin]
name = "Austin"
box = [-97.94, 30.10, -97.56, 30.52]
default_mph = 25   # Austin 2020: residential default lowered to 25
pbf = "https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf"

[city.pittsburgh]
name = "Pittsburgh"
box = [-80.10, 40.36, -79.86, 40.51]
default_mph = 25   # Pennsylvania urban district default
pbf = "https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf"

[city.boston]
name = "Boston"
box = [-71.19, 42.23, -70.99, 42.40]
default_mph = 25
arterial_mph = 25   # Boston 2017: 25 mph citywide default (MGL c.90 s.17C)
pbf = "https://download.geofabrik.de/north-america/us/massachusetts-latest.osm.pbf"
# Boston BLTS 2024 (boston.gov/blts) on Boston Street Segments; lts 1-4, 0 = no bike access. Fetch with
# uv run python scripts/fetch_arcgis.py https://services.arcgis.com/sFnw0xNflSi8J0uh/arcgis/rest/services/BLTS_2024/FeatureServer/0 sources/boston/blts_2024.geojson --fields name,segid,bike_fac,type,speedlimit,lts
overrides = [{ name = "Boston BLTS 2024", path = "sources/boston/blts_2024.geojson", lts = "lts", join = "spatial" }]

[city.new-york]
name = "New York City"
box = [-74.26, 40.49, -73.70, 40.92]
default_mph = 25
arterial_mph = 25   # NYC 2014: 25 mph citywide default unless posted
pbf = "https://download.geofabrik.de/north-america/us/new-york-latest.osm.pbf"

[city.philadelphia]
name = "Philadelphia"
box = [-75.28, 39.87, -74.96, 40.14]
default_mph = 25   # Pennsylvania urban district default
pbf = "https://download.geofabrik.de/north-america/us/pennsylvania-latest.osm.pbf"
# DVRPC LTS Network (catalog.dvrpc.org, dvrpc/gis-lts-calc); one feature per link direction. Fetch with
# uv run python scripts/fetch_arcgis.py https://arcgis.dvrpc.org/portal/rest/services/transportation/lts_network/FeatureServer/0 sources/philadelphia/dvrpc_lts.geojson --box -75.28 39.87 -74.96 40.14 --fields no,fromnodeno,tonodeno,typeno,bike_facility,lts
overrides = [{ name = "DVRPC LTS Network", path = "sources/philadelphia/dvrpc_lts.geojson", lts = "lts", join = "spatial" }]

[city.minneapolis]
name = "Minneapolis"
box = [-93.33, 44.89, -93.19, 45.06]
default_mph = 20
arterial_mph = 25   # Minneapolis 2020: 20 mph residential, 25 mph city arterials
pbf = "https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf"

[city.denver]
name = "Denver"
box = [-105.11, 39.61, -104.60, 39.91]
default_mph = 20   # Denver: 20 mph residential default; arterials posted
pbf = "https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf"

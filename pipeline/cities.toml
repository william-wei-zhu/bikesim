[city.chicago]
name = "Chicago"
box = [-87.94, 41.64, -87.52, 42.03]
default_mph = 30   # citywide default; verify
pbf = "https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf"
# Cook County LTS 2022 (OSM-based, carries way_id). Export
# https://gis.cookcountyil.gov/traditional/rest/services/DOTH_expanded/MapServer/13 to GeoJSON first.
overrides = [{ name = "Cook County LTS 2022", path = "sources/chicago/cook_lts_2022.geojson", way_id = "way_id", lts = "ltsrank" }]

